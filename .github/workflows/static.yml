# Workflow สำหรับ deploy static content ไปยัง GitHub Pages
name: Deploy static content to Pages

on:
  # รันอัตโนมัติทุกครั้งที่ push เข้า branch main
  push:
    branches: ["main"]

  # ให้กด Run workflow เองได้จากแท็บ Actions บน GitHub
  workflow_dispatch:

# กำหนดสิทธิ์ของ GITHUB_TOKEN ให้ deploy ไปยัง Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้มี deployment ที่ทำงานพร้อมกันได้แค่ 1 อัน ต่อคิวรอ
# ไม่ยกเลิก deployment ที่กำลัง run อยู่ เพื่อให้ deploy จบสมบูรณ์ทุกครั้ง
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # เปิดใช้งาน GitHub Pages ให้อัตโนมัติถ้ายังไม่เคยเปิด
          # (ไม่ต้องเข้าไปกดใน Settings > Pages เอง)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ใส่ path ของโฟลเดอร์ที่มีไฟล์เว็บ (ต้องมี index.html อยู่ข้างใน)
          # ถ้าไฟล์ HTML อยู่ที่ root ของ repo ให้ใช้ '.'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
